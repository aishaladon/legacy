<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Legacy P&P BD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { width: 100%; max-width: 360px; padding: 1rem; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); }
    .login-logo { text-align: center; margin-bottom: 1.5rem; }
    .login-logo h1 { font-size: 1.25rem; color: var(--accent); }
    .login-logo p { font-size: .8rem; color: var(--text-muted); margin-top: .25rem; }
    .login-card .form-group { margin-bottom: 1rem; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: .5rem; padding: .65rem; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-card">
      <div class="login-logo">
        <h1>Legacy P&P</h1>
        <p>BD Workspace — Private Access</p>
      </div>
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
    </div>
  </div>
</body>
</html>
