{% extends "base.html" %}
{% block title %}{{ 'Edit' if award else 'New' }} Award Record{% endblock %}
{% block page_title %}{{ 'Edit' if award else 'New' }} Award Record{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label>Awardee Name *</label>
          <input type="text" name="awardee_name" value="{{ award.awardee_name if award else '' }}" required>
        </div>
        <div class="form-group">
          <label>Award Type</label>
          <select name="award_type">
            <option value="">— Select —</option>
            {% for t in ['Contract', 'Grant'] %}
              <option value="{{ t }}" {{ 'selected' if award and award.award_type == t }}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Award Amount ($)</label>
          <input type="number" name="award_amount" value="{{ award.award_amount if award and award.award_amount else '' }}" step="1">
        </div>
        <div class="form-group">
          <label>Award Date</label>
          <input type="date" name="award_date" value="{{ award.award_date.isoformat() if award and award.award_date else '' }}">
        </div>
        <div class="form-group">
          <label>Awarding Agency / Funder</label>
          <input type="text" name="awarding_agency_or_funder" value="{{ award.awarding_agency_or_funder if award else '' }}">
        </div>
        <div class="form-group">
          <label>Contract / Grant Number</label>
          <input type="text" name="contract_or_grant_number" value="{{ award.contract_or_grant_number if award else '' }}">
        </div>
        <div class="form-group">
          <label>NAICS Code</label>
          <input type="text" name="naics_code" value="{{ award.naics_code if award else '' }}">
        </div>
        <div class="form-group">
          <label>Place of Performance</label>
          <input type="text" name="place_of_performance" value="{{ award.place_of_performance if award else '' }}">
        </div>
        <div class="form-group">
          <label>Period of Performance</label>
          <input type="text" name="period_of_performance" value="{{ award.period_of_performance if award else '' }}" placeholder="e.g. Jan 2024 – Dec 2025">
        </div>
        <div class="form-group">
          <label>Set-Aside Type</label>
          <input type="text" name="set_aside_type" value="{{ award.set_aside_type if award else '' }}">
        </div>
        <div class="form-group">
          <label>Subcontract Opportunity</label>
          <div style="margin-top:.5rem;">
            <label style="display:flex;align-items:center;gap:.4rem;">
              <input type="checkbox" name="subcontract_opportunity" {{ 'checked' if award and award.subcontract_opportunity }}> Yes
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>Subcontract Outreach Status</label>
          <select name="subcontract_outreach_status">
            <option value="">— Select —</option>
            {% for s in ['Not Started', 'Contacted', 'Responded', 'Meeting Scheduled', 'Proposal Sent', 'Won', 'Lost'] %}
              <option value="{{ s }}" {{ 'selected' if award and award.subcontract_outreach_status == s }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Subcontract Contact</label>
          <input type="text" name="subcontract_contact" value="{{ award.subcontract_contact if award else '' }}">
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea name="description" rows="3">{{ award.description if award else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes" rows="3">{{ award.notes if award else '' }}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn btn-primary">{{ 'Save Changes' if award else 'Add Award Record' }}</button>
        <a href="{{ url_for('award_history.index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
