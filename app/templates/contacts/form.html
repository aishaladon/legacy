{% extends "base.html" %}
{% block title %}{{ 'Edit' if contact else 'New' }} Contact{% endblock %}
{% block page_title %}{{ 'Edit' if contact else 'New' }} Contact{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="first_name" value="{{ contact.first_name if contact else '' }}" required>
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" name="last_name" value="{{ contact.last_name if contact else '' }}" required>
        </div>
        <div class="form-group">
          <label>Title</label>
          <input type="text" name="title" value="{{ contact.title if contact else '' }}">
        </div>
        <div class="form-group">
          <label>Contact Type</label>
          <select name="contact_type">
            <option value="">— Select —</option>
            {% for ct in contact_types %}
              <option value="{{ ct }}" {{ 'selected' if contact and contact.contact_type == ct }}>{{ ct }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Institution</label>
          <select name="institution_id">
            <option value="">— None —</option>
            {% for inst in institutions %}
              <option value="{{ inst.id }}" {{ 'selected' if contact and contact.institution_id == inst.id }}>{{ inst.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Relationship Warmth</label>
          <select name="relationship_warmth">
            {% for w in ['Cold','Warm','Hot'] %}
              <option value="{{ w }}" {{ 'selected' if contact and contact.relationship_warmth == w }}>{{ w }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ contact.email if contact else '' }}">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" value="{{ contact.phone if contact else '' }}">
        </div>
        <div class="form-group">
          <label>Last Contact Date</label>
          <input type="date" name="last_contact_date" value="{{ contact.last_contact_date.isoformat() if contact and contact.last_contact_date else '' }}">
        </div>
        <div class="form-group">
          <label>Next Follow-Up Date</label>
          <input type="date" name="next_followup_date" value="{{ contact.next_followup_date.isoformat() if contact and contact.next_followup_date else '' }}">
        </div>
        <div class="form-group full">
          <label>LinkedIn URL</label>
          <input type="url" name="linkedin_url" value="{{ contact.linkedin_url if contact else '' }}">
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes" rows="3">{{ contact.notes if contact else '' }}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn btn-primary">{{ 'Save Changes' if contact else 'Add Contact' }}</button>
        <a href="{{ url_for('contacts.index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
