{% extends "base.html" %}
{% block title %}{{ 'Edit' if cap else 'New' }} Capability Statement{% endblock %}
{% block page_title %}{{ 'Edit' if cap else 'New' }} Capability Statement{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label>Title *</label>
          <input type="text" name="title" value="{{ cap.title if cap else '' }}" required>
        </div>
        <div class="form-group">
          <label>Target Audience</label>
          <input type="text" name="target_audience" value="{{ cap.target_audience if cap else '' }}" placeholder="e.g. Federal agencies, Foundations">
        </div>
        <div class="form-group">
          <label>Track</label>
          <select name="track">
            <option value="">— Select —</option>
            {% for t in ['Government', 'Grant', 'Professional', 'All'] %}
              <option value="{{ t }}" {{ 'selected' if cap and cap.track == t }}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group full">
          <label>Core Competencies</label>
          <textarea name="core_competencies" rows="3">{{ cap.core_competencies if cap else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Past Performance Highlights</label>
          <textarea name="past_performance" rows="4">{{ cap.past_performance if cap else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Differentiators</label>
          <textarea name="differentiators" rows="3">{{ cap.differentiators if cap else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>NAICS Codes</label>
          <input type="text" name="naics_codes" value="{{ cap.naics_codes if cap else '' }}" placeholder="e.g. 519120, 541611">
        </div>
        <div class="form-group full">
          <label>Certifications &amp; Set-Asides</label>
          <input type="text" name="certifications" value="{{ cap.certifications if cap else '' }}">
        </div>
        <div class="form-group full">
          <label>Contact / Point of Contact</label>
          <input type="text" name="point_of_contact" value="{{ cap.point_of_contact if cap else '' }}">
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes" rows="3">{{ cap.notes if cap else '' }}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn btn-primary">{{ 'Save Changes' if cap else 'Add Capability Statement' }}</button>
        <a href="{{ url_for('guides.index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
