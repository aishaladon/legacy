{% extends "base.html" %}
{% block title %}{{ 'Edit' if guide else 'New' }} Guide{% endblock %}
{% block page_title %}{{ 'Edit' if guide else 'New' }} Bid Writing Guide{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label>Title *</label>
          <input type="text" name="title" value="{{ guide.title if guide else '' }}" required>
        </div>
        <div class="form-group">
          <label>Guide Type</label>
          <select name="guide_type">
            <option value="">— Select —</option>
            {% for gt in ['RFP Response', 'Grant Proposal', 'LOI', 'Capability Statement', 'General'] %}
              <option value="{{ gt }}" {{ 'selected' if guide and guide.guide_type == gt }}>{{ gt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Track</label>
          <select name="track">
            <option value="">— Select —</option>
            {% for t in ['Government', 'Grant', 'Professional', 'All'] %}
              <option value="{{ t }}" {{ 'selected' if guide and guide.track == t }}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group full">
          <label>Applicable Opportunity Types</label>
          <input type="text" name="applicable_opportunity_types" value="{{ guide.applicable_opportunity_types if guide else '' }}" placeholder="e.g. SBIR, State RFP, NEA Grant">
        </div>
        <div class="form-group full">
          <label>Guide Steps</label>
          <textarea name="guide_steps" rows="5">{{ guide.guide_steps if guide else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Key Questions</label>
          <textarea name="key_questions" rows="4">{{ guide.key_questions if guide else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Sections Required</label>
          <textarea name="sections_required" rows="4">{{ guide.sections_required if guide else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Tips &amp; Warnings</label>
          <textarea name="tips_and_warnings" rows="4">{{ guide.tips_and_warnings if guide else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Example Language</label>
          <textarea name="example_language" rows="5">{{ guide.example_language if guide else '' }}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn btn-primary">{{ 'Save Changes' if guide else 'Add Guide' }}</button>
        <a href="{{ url_for('guides.index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
