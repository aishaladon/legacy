{% extends "base.html" %}
{% block title %}{{ 'Edit' if opp else 'New' }} Opportunity{% endblock %}
{% block page_title %}{{ 'Edit' if opp else 'New' }} Opportunity{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label>Title *</label>
          <input type="text" name="title" value="{{ opp.title if opp else '' }}" required>
        </div>
        <div class="form-group">
          <label>Track</label>
          <select name="track">
            <option value="">— Select —</option>
            {% for t in ['Government','Grant','Professional'] %}
              <option value="{{ t }}" {{ 'selected' if opp and opp.track == t }}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Opportunity Type</label>
          <select name="opportunity_type">
            <option value="">— Select —</option>
            {% for ot in ['Government Contract','Grant-Funded Project','Gig','Job','Subcontract','RFP'] %}
              <option value="{{ ot }}" {{ 'selected' if opp and opp.opportunity_type == ot }}>{{ ot }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Source</label>
          <input type="text" name="source" value="{{ opp.source if opp else '' }}" placeholder="SAM.gov, IMLS, ArchiveGig…">
        </div>
        <div class="form-group">
          <label>Source URL</label>
          <input type="url" name="source_url" value="{{ opp.source_url if opp else '' }}">
        </div>
        <div class="form-group">
          <label>Posted Date</label>
          <input type="date" name="posted_date" value="{{ opp.posted_date.isoformat() if opp and opp.posted_date else '' }}">
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" name="due_date" value="{{ opp.due_date.isoformat() if opp and opp.due_date else '' }}">
        </div>
        <div class="form-group">
          <label>Value Min ($)</label>
          <input type="number" name="contract_amount_min" value="{{ opp.contract_amount_min if opp else '' }}" step="1">
        </div>
        <div class="form-group">
          <label>Value Max ($)</label>
          <input type="number" name="contract_amount_max" value="{{ opp.contract_amount_max if opp else '' }}" step="1">
        </div>
        <div class="form-group">
          <label>NAICS Code</label>
          <input type="text" name="naics_code" value="{{ opp.naics_code if opp else '' }}" placeholder="519120">
        </div>
        <div class="form-group">
          <label>Set-Aside Type</label>
          <select name="set_aside_type">
            <option value="">— None —</option>
            {% for sa in ['WOSB','EDWOSB','8(a)','HUBZone','Unrestricted'] %}
              <option value="{{ sa }}" {{ 'selected' if opp and opp.set_aside_type == sa }}>{{ sa }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Institution Type</label>
          <select name="institution_type">
            <option value="">— Select —</option>
            {% for it in ['Museum','HBCU','Library','Archive','Historical Society','University','Tribal Nation','Government Agency','Private','Foundation','Other'] %}
              <option value="{{ it }}" {{ 'selected' if opp and opp.institution_type == it }}>{{ it }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" name="location_city" value="{{ opp.location_city if opp else '' }}">
        </div>
        <div class="form-group">
          <label>State</label>
          <input type="text" name="location_state" value="{{ opp.location_state if opp else '' }}" maxlength="2" placeholder="CA">
        </div>
        <div class="form-group">
          <label>Region</label>
          <select name="region">
            <option value="">— Select —</option>
            {% for r in ['California','Northeast','Southeast','Midwest','Gulf Coast','Southwest','National'] %}
              <option value="{{ r }}" {{ 'selected' if opp and opp.region == r }}>{{ r }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Alignment Score (1–10)</label>
          <input type="number" name="alignment_score" min="1" max="10" value="{{ opp.alignment_score if opp else '' }}">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            {% for s in ['New','Reviewing','Bidding','Submitted','Won','Lost','Passed','Archived'] %}
              <option value="{{ s }}" {{ 'selected' if opp and opp.status == s }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea name="description" rows="4">{{ opp.description if opp else '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes" rows="3">{{ opp.notes if opp else '' }}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn btn-primary">{{ 'Save Changes' if opp else 'Add Opportunity' }}</button>
        <a href="{{ url_for('opportunities.index') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
