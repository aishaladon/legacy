{% extends "base.html" %}
{% block title %}Edit Pipeline{% endblock %}
{% block page_title %}Edit Pipeline Record{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group">
          <label>Stage</label>
          <select name="stage">
            {% for s in stages %}
              <option value="{{ s }}" {{ 'selected' if item.stage == s }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Go / No-Go</label>
          <select name="go_no_go">
            {% for g in ['Pending','Go','No-Go'] %}
              <option value="{{ g }}" {{ 'selected' if item.go_no_go == g }}>{{ g }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Decision Date</label>
          <input type="date" name="decision_date" value="{{ item.decision_date.isoformat() if item.decision_date else '' }}">
        </div>
        <div class="form-group">
          <label>Submission Date</label>
          <input type="date" name="submission_date" value="{{ item.submission_date.isoformat() if item.submission_date else '' }}">
        </div>
        <div class="form-group">
          <label>Submitted Amount ($)</label>
          <input type="number" name="submitted_amount" value="{{ item.submitted_amount if item.submitted_amount else '' }}" step="1">
        </div>
        <div class="form-group">
          <label>Outcome</label>
          <select name="outcome">
            <option value="">— Pending —</option>
            {% for o in ['Won','Lost','No Award','Cancelled'] %}
              <option value="{{ o }}" {{ 'selected' if item.outcome == o }}>{{ o }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Outcome Date</label>
          <input type="date" name="outcome_date" value="{{ item.outcome_date.isoformat() if item.outcome_date else '' }}">
        </div>
        <div class="form-group">
          <label>Follow-Up Date</label>
          <input type="date" name="followup_date" value="{{ item.followup_date.isoformat() if item.followup_date else '' }}">
        </div>
        <div class="form-group full">
          <label>Lessons Learned</label>
          <textarea name="lessons_learned" rows="3">{{ item.lessons_learned or '' }}</textarea>
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes" rows="3">{{ item.notes or '' }}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:1rem;">
        <button class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('pipeline.detail', pipeline_id=item.id) }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
